services:
  provider-relay:
    image: provider-relay:latest
    container_name: provider-relay
    restart: always
    ports:
      - 18080:18080
    environment:
      - TZ=Asia/Shanghai
      - LISTEN_PORT=18080
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      - ./data:/app/data
networks:
  default:
    external: true
    name: prelay
