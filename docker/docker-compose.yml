services:
  provider-relay:
    image: provider-relay:latest
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: provider-relay
    restart: always
    ports:
      - 18080:18080
    environment:
      - TZ=Asia/Shanghai
      - LISTEN_PORT=18080
      - PROVIDER_RELAY_MASTER_KEY=${PROVIDER_RELAY_MASTER_KEY:?set a Base64-encoded 32-byte master key}
    volumes:
      - ./data:/app/data
networks:
  default:
    external: true
    name: prelay
