[[providers]]
id = "gotoken"
name = "GoToken 套餐"
auth_scheme = "bearer"
base_url = "https://gotoken.cc"
protocols = [
  "chat_completions",
  "responses",
  "images_generations",
]
language_models = [
  "gpt-6-luna",
  "gpt-6-sol",
  "gpt-6-astra",
  "gpt-6.1-sol",
]
image_generation_models = [
  "gpt-image-1",
  "gpt-image-1.5",
  "gpt-image-2",
]

[providers.protocol_base_urls]
chat_completions = "https://gotoken.cc/v1"
images_generations = "https://gotoken.cc/v1"

[[providers]]
id = "deepseek"
name = "DeepSeek 开放平台"
auth_scheme = "bearer"
base_url = "https://api.deepseek.com/v1"
protocols = ["chat_completions", "responses"]
language_models = [
  "deepseek-v4-pro",
  "deepseek-flash",
]

[[providers]]
id = "bigmodel_coding_plan"
name = "GLM Coding Plan"
auth_scheme = "bearer"
base_url = "https://open.bigmodel.cn/api/v1"
protocols = ["chat_completions", "responses"]
language_models = ["glm-5.3", "glm-5.3-flash"]

[[providers]]
id = "qwen_token_plan"
name = "千问 Token Plan"
auth_scheme = "bearer"
base_url = "https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
protocols = ["chat_completions", "responses"]
language_models = [
  "qwen3.8-max",
  "qwen3.8-flash",
]

[[providers]]
id = "kimi"
name = "Kimi Code"
auth_scheme = "bearer"
base_url = "https://api.kimi.com/coding/v1"
protocols = ["chat_completions", "responses"]
language_models = [
  "k3",
]

[[providers]]
id = "minimax"
name = "MiniMax Token Plan"
auth_scheme = "bearer"
base_url = "https://api.minimax.cn/v1"
protocols = ["chat_completions", "responses"]
language_models = ["MiniMax-M3"]

[[providers]]
id = "commandcode"
name = "Command Code"
auth_scheme = "bearer"
base_url = "https://api.commandcode.ai/provider/v1"
protocols = ["chat_completions", "responses"]
language_models = [
  "gpt-6-astra",
  "gpt-6-luna",
  "gpt-6-sol",
  "gpt-6.1-sol",
  "deepseek-flash",
  "deepseek-v4-pro",
  "qwen3.8-max",
  "qwen3.8-flash",
  "k3",
  "glm-5.3",
  "glm-5.3-flash",
  "MiniMax-M3",
]

[providers.upstream_model_names]
deepseek-flash = "deepseek/deepseek-v4.1-flash"
deepseek-v4-pro = "deepseek/deepseek-v4-pro"
"qwen3.8-max" = "Qwen/Qwen3.8-Max"
"qwen3.8-flash" = "Qwen/Qwen3.8-Flash"
k3 = "moonshotai/Kimi-K3"
"glm-5.3" = "zai-org/GLM-5.3"
"glm-5.3-flash" = "z-ai/glm-5.3-flash"
MiniMax-M3 = "MiniMaxAI/MiniMax-M3"

[[providers]]
id = "opencode_go"
name = "OpenCode Go"
auth_scheme = "bearer"
base_url = "https://opencode.ai/inference/go/openai/v1"
protocols = ["chat_completions", "responses"]
language_models = [
  "gpt-6-luna",
  "deepseek-flash",
  "deepseek-v4-pro",
  "qwen3.8-max",
  "qwen3.8-flash",
  "k3",
  "glm-5.3",
  "glm-5.3-flash",
  "MiniMax-M3",
]

# 通用上游请求头：literal 为静态值，source = "session_id" 使用当前会话 ID。
[providers.request_headers]
x-opencode-session = { source = "session_id" }

[providers.upstream_model_names]
deepseek-flash = "deepseek-v4.1-flash"
k3 = "kimi-k3"
MiniMax-M3 = "minimax-m3"
