[package]
name = "prelay-server"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "prelay-server"
path = "src/main.rs"

[lib]
name = "prelay_server"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
prelay-protocol = { path = "crates/protocol" }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "2.0.2", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
sea-orm-migration = { version = "2.0.2", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
