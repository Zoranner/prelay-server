[[providers]]
id = "gotoken"
name = "GoToken 套餐"
auth_scheme = "bearer"
base_url = "https://gotoken.cc"
protocols = [
  "chat_completions",
  "responses",
  "anthropic_messages",
  "images_generations",
]
language_models = [
  "gpt-5.6-luna",
  "gpt-5.6-terra",
  "gpt-5.6-sol",
]
image_generation_models = [
  "gpt-image-1",
  "gpt-image-1.5",
  "gpt-image-2",
]

[providers.protocol_base_urls]
chat_completions = "https://gotoken.cc/v1"
anthropic_messages = "https://gotoken.cc/v1"
images_generations = "https://gotoken.cc/v1"

